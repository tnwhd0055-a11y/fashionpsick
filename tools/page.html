<!DOCTYPE html>
<html lang="ko">
<head>
<script>
  /* 예전 주소(tnwhd0055-a11y.github.io/fashionpsick)로 들어오면 정식 주소로 넘긴다 (2026-11 도메인 이전) */
  if (/github\.io$/.test(location.hostname)) location.replace("https://sikseoul.com/" + location.search + location.hash);
</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<base href="/" />
{{HEAD}}
<link rel="stylesheet" href="styles.css" />
<style>
  html, body { margin: 0; background: var(--paper); }
  #root { min-height: 100vh; }
  /* 자바스크립트가 뜨기 전(그리고 검색엔진)이 읽는 정적 본문. 앱이 뜨면 통째로 교체된다 */
  .pre { max-width: 1080px; margin: 0 auto; padding: 20px 16px 60px; font: 15px/1.7 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: #1a1a1a; word-break: keep-all; }
  .pre a { color: inherit; }
  .pre-nav { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; font-size: 12px; letter-spacing: .08em; padding-bottom: 16px; border-bottom: 1px solid #e6e1d8; }
  .pre-nav img { height: 22px; width: auto; margin-right: 12px; }
  .pre h1 { font-size: 22px; line-height: 1.35; margin: 28px 0 8px; }
  .pre h2 { font-size: 16px; margin: 32px 0 10px; }
  .pre-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; padding: 0; list-style: none; }
  .pre-grid img, .pre-hero img { width: 100%; height: auto; display: block; background: #efece6; }
  .pre-hero { max-width: 520px; }
  .pre table { border-collapse: collapse; font-size: 13px; }
  .pre th, .pre td { text-align: left; padding: 4px 14px 4px 0; vertical-align: top; }
  .pre-price s { color: #8b857b; margin-left: 8px; font-size: 13px; }
  .pre-foot { margin-top: 48px; padding-top: 16px; border-top: 1px solid #e6e1d8; font-size: 12px; color: #6b665e; }
</style>
</head>
<body>
<div id="root">{{BODY}}</div>

<!-- 빌드 결과물: tools/build.mjs 가 .jsx 를 미리 컴파일해 app.js 하나로 묶는다 (브라우저 Babel 안 씀) -->
<script defer src="vendor/react.production.min.js"></script>
<script defer src="vendor/react-dom.production.min.js"></script>
<script defer src="_ds_bundle.js"></script>
<script defer src="data.js"></script>
<script defer src="shop-config.js"></script>
<script defer src="shop.js"></script>
<script defer src="app.js?v={{VER}}"></script>
</body>
</html>
